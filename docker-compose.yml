services:
  web:
    build: .
    ports:
      - "${RAILS_PORT:-3000}:3000"
    volumes:
      - ./sandbox:/app
      - rails7.2:/usr/local/bundle
    tty: true
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
  db:
    image: postgres:18.0-alpine
    volumes:
      - pgsqldb18.0:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
  # db:
  #   image: mysql:8.0.33
  #   command: --default-authentication-plugin=mysql_native_password
  #   volumes:
  #     - mysqldb8.0:/var/lib/mysql
  #   environment:
  #     - MYSQL_ALLOW_EMPTY_PASSWORD=yes

volumes:
  pgsqldb18.0:
    driver: local
  # mysqldb8.0:
  #   driver: local
  rails7.2:
    driver: local
