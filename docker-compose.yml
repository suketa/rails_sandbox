services:
  web:
    build: .
    image: rails_sandbox:7.2.0b1
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_rails7.2.0b1:/usr/local/bundle
    tty: true
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
  db:
    image: postgres:16.3-alpine3.20
    volumes:
      - pgsqldb16.3:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD

volumes:
  pgsqldb16.3:
    driver: local
  bundle_rails7.2.0b1:
    driver: local
